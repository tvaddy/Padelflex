<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="padelGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BFFF00"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#BFFF00" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Subtle court lines in background -->
  <rect x="76" y="76" width="360" height="360" rx="36" fill="none" stroke="#27272A" stroke-width="6"/>
  <line x1="76" y1="256" x2="436" y2="256" stroke="#27272A" stroke-width="4" stroke-dasharray="10 10"/>
  <line x1="256" y1="76" x2="256" y2="436" stroke="#27272A" stroke-width="4"/>

  <!-- Padel Racket & Ball Icon -->
  <g transform="translate(40, 20)">
    <!-- Racket Head -->
    <ellipse cx="200" cy="190" rx="100" ry="120" fill="none" stroke="url(#padelGrad)" stroke-width="22" filter="url(#glow)"/>
    
    <!-- Padel Grid Dots (perforations) -->
    <circle cx="170" cy="150" r="8" fill="#BFFF00"/>
    <circle cx="200" cy="150" r="8" fill="#BFFF00"/>
    <circle cx="230" cy="150" r="8" fill="#BFFF00"/>
    
    <circle cx="155" cy="185" r="8" fill="#BFFF00"/>
    <circle cx="185" cy="185" r="8" fill="#BFFF00"/>
    <circle cx="215" cy="185" r="8" fill="#BFFF00"/>
    <circle cx="245" cy="185" r="8" fill="#BFFF00"/>

    <circle cx="170" cy="220" r="8" fill="#BFFF00"/>
    <circle cx="200" cy="220" r="8" fill="#BFFF00"/>
    <circle cx="230" cy="220" r="8" fill="#BFFF00"/>

    <!-- Throat & Handle -->
    <path d="M 175 300 L 182 340 L 175 420 C 175 428, 185 435, 200 435 C 215 435, 225 428, 225 420 L 218 340 L 225 300" fill="#27272A" stroke="#BFFF00" stroke-width="8"/>
    <!-- Handle Grip Lines -->
    <line x1="178" y1="360" x2="222" y2="360" stroke="#71717A" stroke-width="4"/>
    <line x1="177" y1="380" x2="223" y2="380" stroke="#71717A" stroke-width="4"/>
    <line x1="176" y1="400" x2="224" y2="400" stroke="#71717A" stroke-width="4"/>

    <!-- Padel Ball (bright yellow/green) -->
    <circle cx="340" cy="130" r="42" fill="#BFFF00" filter="url(#glow)"/>
    <path d="M 315 105 C 330 120, 330 140, 315 155" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round"/>
    <path d="M 365 105 C 350 120, 350 140, 365 155" fill="none" stroke="#0A0A0A" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
