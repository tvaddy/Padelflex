version: '3.8'

services:
  padel-app:
    # Build from the multi-stage Dockerfile
    build:
      context: .
      dockerfile: Dockerfile
    container_name: padel-league-pwa
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - TZ=Europe/Oslo
      - DATABASE_URL=file:/app/data/padel.db
      - USER_PASSWORD=padel123
      - ADMIN_PASSWORD=your_secret_admin_password
      - PORT=3000
      # Language: 'no' (Norwegian, default) or 'en' (English). Injected dynamically at runtime!
      - NEXT_PUBLIC_APP_LANGUAGE=en
      # Test profile: set to 'true' to show sample players on login screen. Injected dynamically at runtime!
      - NEXT_PUBLIC_ENABLE_TEST_PROFILE=true
      - NEXT_PUBLIC_PWA_URL=https://padel.example.com
    volumes:
      # Persistent volume for SQLite database storage
      - ./padel-data:/app/data
    ports:
      - "3000:3000"
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.padelapp.rule=Host(`padel.example.com`)"
      - "traefik.http.routers.padelapp.entrypoints=websecure"
      - "traefik.http.routers.padelapp.tls=true"
      - "traefik.http.services.padelapp.loadbalancer.server.port=3000"

networks:
  proxy:
    external: true # Assumes Traefik or reverse proxy running on external network
